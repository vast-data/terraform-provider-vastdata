[pytest]
# Pytest configuration for Terraform Provider E2E tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    e2e: End-to-end tests that require a live VAST cluster
    slow: Tests that take a long time to run

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test paths
testpaths = .

# Timeout
timeout = 300

